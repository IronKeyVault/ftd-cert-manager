[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ftd-cert-manager"
version = "0.1.0"
description = "Automated Let's Encrypt certificate management for Cisco FTD RA VPN"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    { name = "Kasper Elsborg", email = "kasper@elsborg.eu" },
]
dependencies = [
    "wingpy>=1.3.1",
    "cryptography>=41.0.0",
    "keyring>=24.0.0",
    "certbot>=2.11.0",
    "certbot-dns-cloudflare>=2.11.0",
]

[project.scripts]
ftd-cert-manager = "ftd_cert_manager.cli:main"

[tool.setuptools.packages.find]
include = ["ftd_cert_manager*"]
